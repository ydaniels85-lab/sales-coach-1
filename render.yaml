services:
  - type: web
    name: fin-tastic-sales-coach
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: 10000
      - key: FLASK_DEBUG
        value: "0"
      - key: DATA_DIR
        value: /var/data/data
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: PYTHONUNBUFFERED
        value: "1"
    disk:
      name: fin-tastic-data
      mountPath: /var/data
      sizeGB: 1
